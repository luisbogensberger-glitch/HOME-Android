name: HOME Command Bridge

on:
  push:
    branches: [ main ]
    paths:
      - 'home-bridge/queue.json'
      - 'home-bridge/push_commands.py'
      - 'home-bridge/encrypt_command.py'
      - '.github/workflows/home-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-command-bridge
  cancel-in-progress: false

jobs:
  push-home-commands:
    runs-on: ubuntu-latest
    env:
      HOME_TOKEN: ${{ secrets.HOME_TOKEN }}
      HOME_API: https://luis-home-sync.luisbogensberger.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install secure bridge dependencies
        run: python3 -m pip install --disable-pip-version-check cryptography curl_cffi

      - name: Decrypt and push queued commands to HOME Sync
        run: python3 home-bridge/push_commands.py

      - name: Publish bridge public key and acknowledge processed commands
        shell: bash
        run: |
          if git diff --quiet -- home-bridge/queue.json home-bridge/public_key.json; then
            exit 0
          fi
          git config user.name "HOME Bridge"
          git config user.email "home-bridge@users.noreply.github.com"
          git add home-bridge/queue.json home-bridge/public_key.json
          git commit -m "Acknowledge encrypted HOME bridge commands [skip ci]"
          git pull --rebase origin main
          git push origin main
