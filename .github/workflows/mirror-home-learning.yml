name: Mirror HOME learning to Supabase

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/mirror-home-learning.yml'
      - 'scripts/mirror_home_learning.py'
      - 'LEARNING_MIRROR_TRIGGER.txt'

permissions:
  contents: read
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          RESPONSE="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=home-learning-ingest")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RESPONSE")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Mirror private written learning attempts
        env:
          HOME_TOKEN: ${{ secrets.HOME_TOKEN }}
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          HOME_API: https://luis-home-sync.luisbogensberger.workers.dev
          SUPABASE_INGEST: https://skgmgxthymnzubbobqxu.supabase.co/functions/v1/home-learning-ingest
        run: python3 scripts/mirror_home_learning.py
