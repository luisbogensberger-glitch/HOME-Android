name: Build V-Brain Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'tube-feed.json'
      - 'adaptive-ui.json'
      - 'home-runtime/**'
      - 'home-bridge/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recreate Android source
        shell: bash
        run: |
          cat payload/part*.txt > source.b64
          base64 -d source.b64 > source.zip
          mkdir -p src
          unzip -q source.zip -d src

      - name: Apply To-Do detail update
        shell: bash
        run: |
          cat todo-patch/part* > todo-details.patch
          cd src
          patch -p1 < ../todo-details.patch

      - name: Add Android overlay
        run: cp -a sync-overlay/app/src/main/. src/luis-home-app/app/src/main/

      - name: Build and validate complete live release
        run: |
          python3 scripts/build_live_release.py --check
          python3 scripts/verify_release.py
          cp home-runtime/live-app.html src/luis-home-app/app/src/main/assets/live-app.html
          cp home-runtime/live-release.json src/luis-home-app/app/src/main/assets/live-release.json
          cp branding/vbrain_launcher.xml src/luis-home-app/app/src/main/res/drawable/vbrain_launcher.xml
          python3 - <<'PYCODE'
          from pathlib import Path
          import os,re
          p=Path('src/luis-home-app/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode \d+', 'versionCode '+str(17000+int(os.environ['GITHUB_RUN_NUMBER'])),s)
          s=re.sub(r"versionName '[^']+'", "versionName '17.0.'"+" + '"+os.environ['GITHUB_RUN_NUMBER']+"'",s)
          p.write_text(s)
          PYCODE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable V-Brain signer
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: home-android-debug-keystore-v1

      - name: Ensure stable V-Brain signer
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Established signing key missing; refusing an incompatible update."
            exit 1
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: src/luis-home-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Re-sign and verify APK
        shell: bash
        run: |
          SRC="src/luis-home-app/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out V-Brain-STABLE.apk "$SRC"
          "$APKSIGNER" verify --verbose --print-certs V-Brain-STABLE.apk

      - name: Verify shipped UI and native registration
        run: python3 scripts/verify_release.py V-Brain-STABLE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V-Brain-STABLE-apk
          path: V-Brain-STABLE.apk
          if-no-files-found: error
