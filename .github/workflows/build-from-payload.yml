name: Build HOME Android APK

on:
  push:
    branches: [ main, feature/notion-task-sync, worker-backend-sync ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recreate Android source
        shell: bash
        run: |
          cat payload/part*.txt > source.b64
          base64 -d source.b64 > source.zip
          mkdir -p src
          unzip -q source.zip -d src
      - name: Apply To-Do detail update
        shell: bash
        run: |
          cat todo-patch/part* > todo-details.patch
          cd src
          patch -p1 < ../todo-details.patch
      - name: Add HOME Worker sync
        run: cp -a sync-overlay/app/src/main/. src/luis-home-app/app/src/main/
      - name: Relabel legacy UI text
        shell: bash
        run: |
          FILE="src/luis-home-app/app/src/main/assets/index.html"
          sed -i 's/Connect Notion/Connect HOME/g' "$FILE"
          sed -i 's/Syncing with Notion…/Syncing with HOME Sync…/g' "$FILE"
          sed -i 's/Could not read Notion tasks/Could not read HOME tasks/g' "$FILE"
          sed -i 's/Adding to Notion…/Adding to HOME Sync…/g' "$FILE"
          sed -i 's/Open full task guidance in Notion ↗/Open full task guidance ↗/g' "$FILE"
      - name: Add Lean Startup learning card fallback
        run: python3 scripts/add_lean_card.py
      - name: Enable live Tube feed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/luis-home-app/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="tube-remote.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: src/luis-home-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp src/luis-home-app/app/build/outputs/apk/debug/app-debug.apk HOME-worker-sync.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOME-worker-sync-apk
          path: HOME-worker-sync.apk
          if-no-files-found: error
