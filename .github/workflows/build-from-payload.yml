name: Build HOME Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recreate Android source
        shell: bash
        run: |
          cat payload/part*.txt > source.b64
          base64 -d source.b64 > source.zip
          mkdir -p src
          unzip -q source.zip -d src
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: src/luis-home-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp src/luis-home-app/app/build/outputs/apk/debug/app-debug.apk HOME-v1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOME-v1-apk
          path: HOME-v1.apk
          if-no-files-found: error
