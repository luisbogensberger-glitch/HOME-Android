name: Build V-Brain Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'tube-feed.json'
      - 'adaptive-ui.json'
      - 'home-runtime/**'
      - 'home-bridge/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recreate Android source
        shell: bash
        run: |
          cat payload/part*.txt > source.b64
          base64 -d source.b64 > source.zip
          mkdir -p src
          unzip -q source.zip -d src

      - name: Apply To-Do detail update
        shell: bash
        run: |
          cat todo-patch/part* > todo-details.patch
          cd src
          patch -p1 < ../todo-details.patch

      - name: Add Android overlay
        run: |
          cp -a sync-overlay/app/src/main/. src/luis-home-app/app/src/main/
          cp -a sync-overlay/app/src/androidTest src/luis-home-app/app/src/androidTest

      - name: Harden V-Brain 18 private sync
        run: python3 scripts/patch_worker_sync_v18.py src/luis-home-app/app/src/main/java/com/luis/home/WorkerSync.java

      - name: Add Veqrya session auth
        run: |
          python3 scripts/patch_veqrya_auth_v22.py \
            src/luis-home-app/app/src/main/java/com/luis/home/WorkerSync.java \
            src/luis-home-app/app/src/main/java/com/luis/home/MainActivity.java
          python3 scripts/verify_native_auth_v22.py \
            src/luis-home-app/app/src/main/java/com/luis/home/WorkerSync.java \
            src/luis-home-app/app/src/main/java/com/luis/home/MainActivity.java

      - name: Harden V-Brain 19 live rollback watchdog
        run: python3 scripts/patch_runtime_watchdog_v19.py src/luis-home-app/app/src/main/java/com/luis/home/MainActivity.java

      - name: Speed up V-Brain 23 startup recovery
        run: python3 scripts/patch_runtime_fast_v23.py src/luis-home-app/app/src/main/java/com/luis/home/MainActivity.java

      - name: Repair legacy task identity in live UI
        run: python3 scripts/patch_vbrain_task_identity_v29.py sync-overlay/app/src/main/assets/vbrain-one-ui-v25.js

      - name: Build and validate lean live release
        run: |
          python3 scripts/build_live_release.py
          python3 scripts/build_live_release.py --check
          python3 scripts/verify_release.py
          cp home-runtime/live-app.html src/luis-home-app/app/src/main/assets/live-app.html
          cp home-runtime/live-release.json src/luis-home-app/app/src/main/assets/live-release.json
          cp branding/vbrain_launcher.xml src/luis-home-app/app/src/main/res/drawable/vbrain_launcher.xml
          python3 - <<'PYCODE'
          from pathlib import Path
          import os,re
          p=Path('src/luis-home-app/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode \d+', 'versionCode '+str(18000+int(os.environ['GITHUB_RUN_NUMBER'])),s)
          s=re.sub(r"versionName '[^']+'", "versionName '18.0.'"+" + '"+os.environ['GITHUB_RUN_NUMBER']+"'",s)
          s=s.replace("minSdk 26", 'minSdk 26\n        testInstrumentationRunner "com.luis.home.RuntimeSmoke"')
          p.write_text(s)
          PYCODE

      - name: Verify lean browser runtime
        run: |
          npm install --prefix tests --no-package-lock --no-save playwright@1.56.1
          node tests/vbrain-lean-v24.e2e.cjs

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V-Brain-ui-check
          path: '*-screen-test.png'
          if-no-files-found: ignore

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable V-Brain signer
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: home-android-debug-keystore-v1

      - name: Ensure stable V-Brain signer
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Established signing key missing; refusing an incompatible update."
            exit 1
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: src/luis-home-app
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Android live activation and rollback
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r src/luis-home-app/app/build/outputs/apk/debug/app-debug.apk
            adb install -r src/luis-home-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.luis.home android.permission.POST_NOTIFICATIONS
            adb shell cmd connectivity airplane-mode enable || true
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell am instrument -w com.luis.home.test/com.luis.home.RuntimeSmoke | tee android-smoke.txt
            grep -q VBRAIN_SMOKE_OK android-smoke.txt

      - name: Re-sign and verify APK
        shell: bash
        run: |
          SRC="src/luis-home-app/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out V-Brain-STABLE.apk "$SRC"
          "$APKSIGNER" verify --verbose --print-certs V-Brain-STABLE.apk

      - name: Verify shipped UI and native registration
        run: python3 scripts/verify_release.py V-Brain-STABLE.apk

      - name: Publish verified host-18 live release
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "V-Brain Release"
          git config user.email "vbrain-release@users.noreply.github.com"
          git add home-runtime/live-app.html home-runtime/live-release.json
          if git diff --cached --quiet; then
            echo "Live release already current."
          else
            git commit -m "Publish V-Brain 18 live release [skip ci]"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V-Brain-STABLE-apk
          path: V-Brain-STABLE.apk
          if-no-files-found: error
