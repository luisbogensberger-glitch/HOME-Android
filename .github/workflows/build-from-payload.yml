name: Build V-Brain Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'tube-feed.json'
      - 'adaptive-ui.json'
      - 'home-runtime/**'
      - 'home-bridge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recreate Android source
        shell: bash
        run: |
          cat payload/part*.txt > source.b64
          base64 -d source.b64 > source.zip
          mkdir -p src
          unzip -q source.zip -d src

      - name: Apply To-Do detail update
        shell: bash
        run: |
          cat todo-patch/part* > todo-details.patch
          cd src
          patch -p1 < ../todo-details.patch

      - name: Add Android overlay
        run: cp -a sync-overlay/app/src/main/. src/luis-home-app/app/src/main/

      - name: Bake stable local runtime
        shell: bash
        run: |
          ASSETS="src/luis-home-app/app/src/main/assets"
          cp home-runtime/runtime.js "$ASSETS/runtime.js"
          cp home-runtime/runtime.css "$ASSETS/runtime.css"

      - name: Build single-core V-Brain shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/luis-home-app/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')

          banned=[
            'behavior-v3.js','behavior-v3.css','recovery-code-v1.js','living-brain-v6.js',
            'state-resilience-v2.js','v-backup-ui-v1.js','dynamic-shell-v5.js',
            'remote-extension-loader.js','post-install-resilience-v1.js','behaviour-map-v4.js',
            'feedback-pulse-v1.js','safe-tools-v1.js','vbrain-stability-v1.js',
            'vbrain-safe-shell-v2.js','vbrain-live-v9.js'
          ]
          for name in banned:
            s=re.sub(r'<script[^>]+src=["\'][^"\']*'+re.escape(name)+r'[^"\']*["\'][^>]*>\s*</script>\s*','',s,flags=re.I)
            s=re.sub(r'<link[^>]+href=["\'][^"\']*'+re.escape(name)+r'[^"\']*["\'][^>]*>\s*','',s,flags=re.I)

          css_tags=[
            '<link rel="stylesheet" href="home-ui-v2.css" />',
            '<link rel="stylesheet" href="adaptive-runtime.css" />',
            '<link rel="stylesheet" href="todo-premium.css" />',
            '<link rel="stylesheet" href="runtime.css" />',
          ]
          js_tags=[
            '<script src="home-ui-v2.js"></script>',
            '<script src="adaptive-runtime.js"></script>',
            '<script src="todo-premium.js"></script>',
            '<script src="runtime.js"></script>',
            '<script src="tube-remote.js"></script>',
            '<script src="vbrain-safe-shell-v3.js"></script>',
            '<script src="vbrain-patch-v10.js"></script>',
            '<script src="vbrain-autonomy-v11.js"></script>',
            '<script src="vbrain-context-v12.js"></script>',
            '<script src="vbrain-sense-v13.js"></script>',
          ]
          for tag in css_tags:
            if tag not in s: s=s.replace('</head>',tag+'\n</head>',1)
          for tag in js_tags:
            if tag not in s: s=s.replace('</body>',tag+'\n</body>',1)
          s=s.replace('<title>HOME</title>','<title>V-Brain</title>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Enable native bridges and live inbox services
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java=Path('src/luis-home-app/app/src/main/java/com/luis/home/MainActivity.java')
          s=java.read_text(encoding='utf-8')
          needle='webView.addJavascriptInterface(new NativeBridge(), "Native");'
          if '"AdaptiveNative"' not in s:
              s=s.replace(needle,needle+'\n        webView.addJavascriptInterface(new AdaptiveBridge(this, worker, syncQueue, webView), "AdaptiveNative");',1)
          if '"VBrainNative"' not in s:
              anchor='webView.addJavascriptInterface(new AdaptiveBridge(this, worker, syncQueue, webView), "AdaptiveNative");'
              s=s.replace(anchor,anchor+'\n        webView.addJavascriptInterface(new VBrainSettingsBridge(this), "VBrainNative");',1)
          java.write_text(s,encoding='utf-8')

          manifest=Path('src/luis-home-app/app/src/main/AndroidManifest.xml')
          m=manifest.read_text(encoding='utf-8')
          permission='<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if 'android.permission.POST_NOTIFICATIONS' not in m:
              m=m.replace('<application',permission+'\n    <application',1)

          services='''
        <service
            android:name=".WhatsAppNotificationListener"
            android:label="V-Brain live inbox"
            android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
            android:exported="true">
            <intent-filter>
                <action android:name="android.service.notification.NotificationListenerService" />
            </intent-filter>
        </service>
        <service
            android:name=".WhatsAppAccessibilityService"
            android:label="V-Brain WhatsApp screen reader"
            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
            android:exported="true">
            <intent-filter>
                <action android:name="android.accessibilityservice.AccessibilityService" />
            </intent-filter>
            <meta-data
                android:name="android.accessibilityservice"
                android:resource="@xml/home_whatsapp_accessibility" />
        </service>
'''
          if '.WhatsAppNotificationListener' not in m:
              m=m.replace('</application>',services+'    </application>',1)
          manifest.write_text(m,encoding='utf-8')
          PY

      - name: Apply V-Brain icon and name
        shell: bash
        run: |
          mkdir -p src/luis-home-app/app/src/main/res/drawable
          cp branding/vbrain_launcher.xml src/luis-home-app/app/src/main/res/drawable/vbrain_launcher.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('src/luis-home-app/app/src/main/AndroidManifest.xml')
          m=manifest.read_text(encoding='utf-8')
          app=re.search(r'<application\b[^>]*>',m,re.S)
          if not app: raise SystemExit('No application tag')
          tag=app.group(0)
          def set_attr(tag,name,value):
            if re.search(rf'android:{name}="[^"]*"',tag): return re.sub(rf'android:{name}="[^"]*"',f'android:{name}="{value}"',tag,1)
            return tag[:-1]+f' android:{name}="{value}">'
          tag=set_attr(tag,'icon','@drawable/vbrain_launcher')
          tag=set_attr(tag,'roundIcon','@drawable/vbrain_launcher')
          tag=set_attr(tag,'label','V-Brain')
          m=m[:app.start()]+tag+m[app.end():]
          manifest.write_text(m,encoding='utf-8')
          PY

      - name: Enable local WebView access
        shell: bash
        run: |
          FILE="src/luis-home-app/app/src/main/java/com/luis/home/MainActivity.java"
          sed -i 's/settings.setAllowFileAccessFromFileURLs(false);/settings.setAllowFileAccessFromFileURLs(true);/' "$FILE"
          sed -i 's/settings.setAllowUniversalAccessFromFileURLs(false);/settings.setAllowUniversalAccessFromFileURLs(true);/' "$FILE"

      - name: Add Lean Startup fallback
        run: python3 scripts/add_lean_card.py

      - name: Validate interaction architecture
        shell: bash
        run: |
          ASSETS="src/luis-home-app/app/src/main/assets"
          INDEX="$ASSETS/index.html"
          MANIFEST="src/luis-home-app/app/src/main/AndroidManifest.xml"
          sed -i 's/setTimeout(diagnose,400);setTimeout(diagnose,1200)//' "$ASSETS/vbrain-safe-shell-v3.js"
          grep -q 'vbrain-safe-shell-v3.js' "$INDEX"
          grep -q 'vbrain-patch-v10.js' "$INDEX"
          grep -q 'vbrain-autonomy-v11.js' "$INDEX"
          grep -q 'vbrain-context-v12.js' "$INDEX"
          grep -q 'vbrain-sense-v13.js' "$INDEX"
          grep -q 'runtime.js' "$INDEX"
          grep -q 'tube-remote.js' "$INDEX"
          grep -q '.WhatsAppNotificationListener' "$MANIFEST"
          grep -q '.WhatsAppAccessibilityService' "$MANIFEST"
          ! grep -q 'remote-extension-loader.js' "$INDEX"
          ! grep -q 'vbrain-live-v9.js' "$INDEX"
          ! grep -q 'behavior-v3.js' "$INDEX"
          ! grep -q 'living-brain-v6.js' "$INDEX"
          ! grep -q 'state-resilience-v2.js' "$INDEX"
          ! grep -q 'vbrain-safe-shell-v2.js' "$INDEX"
          node --check "$ASSETS/home-ui-v2.js"
          node --check "$ASSETS/adaptive-runtime.js"
          node --check "$ASSETS/runtime.js"
          node --check "$ASSETS/tube-remote.js"
          node --check "$ASSETS/vbrain-safe-shell-v3.js"
          node --check "$ASSETS/vbrain-patch-v10.js"
          node --check "$ASSETS/vbrain-autonomy-v11.js"
          node --check "$ASSETS/vbrain-context-v12.js"
          node --check "$ASSETS/vbrain-sense-v13.js"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/luis-home-app/app/src/main/assets/index.html').read_text()
          required=['home-ui-v2.js','adaptive-runtime.js','runtime.js','tube-remote.js','vbrain-safe-shell-v3.js','vbrain-patch-v10.js','vbrain-autonomy-v11.js','vbrain-context-v12.js','vbrain-sense-v13.js']
          positions=[s.index(x) for x in required]
          assert positions==sorted(positions), positions
          unsafe=['remote-extension-loader.js','vbrain-live-v9.js','behavior-v3.js','recovery-code-v1.js','living-brain-v6.js','state-resilience-v2.js','vbrain-stability-v1.js']
          assert not any(x in s for x in unsafe)
          print('Interaction architecture validated')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable V-Brain signer
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: home-android-debug-keystore-v1

      - name: Ensure stable V-Brain signer
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=V-Brain,C=GB"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: src/luis-home-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Re-sign and verify APK
        shell: bash
        run: |
          SRC="src/luis-home-app/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out V-Brain-STABLE.apk "$SRC"
          "$APKSIGNER" verify --verbose --print-certs V-Brain-STABLE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V-Brain-STABLE-apk
          path: V-Brain-STABLE.apk
          if-no-files-found: error
