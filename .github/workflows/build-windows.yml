name: Build HOME Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'home-runtime/behavior-v3.js'
      - 'home-runtime/feedback-pulse-v1.js'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare HOME desktop web assets
        shell: bash
        run: |
          mkdir -p desktop/web
          cp -a sync-overlay/app/src/main/assets/. desktop/web/
          cp home-runtime/behavior-v3.js desktop/web/behavior-v3.js
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop/web/index.html')
          s=p.read_text(encoding='utf-8')
          head_tags=[
            '<link rel="stylesheet" href="home-ui-v2.css" />',
            '<link rel="stylesheet" href="adaptive-runtime.css" />',
            '<link rel="stylesheet" href="todo-premium.css" />',
            '<link rel="stylesheet" href="behavior-v3.css" />',
            '<script src="desktop-bridge.js"></script>',
          ]
          body_tags=[
            '<script src="home-ui-v2.js"></script>',
            '<script src="adaptive-runtime.js"></script>',
            '<script src="todo-premium.js"></script>',
            '<script src="behavior-v3.js"></script>',
            '<script src="dynamic-shell-v5.js"></script>',
            '<script src="tube-remote.js"></script>',
            '<script src="remote-extension-loader.js"></script>',
          ]
          for tag in head_tags:
            if tag not in s:
              s=s.replace('</head>',tag+'\n</head>',1)
          for tag in body_tags:
            if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          s=s.replace('Connect Notion','Connect HOME')
          s=s.replace('Syncing with Notion…','Syncing with HOME Sync…')
          s=s.replace('Could not read Notion tasks','Could not read HOME tasks')
          s=s.replace('Adding to Notion…','Adding to HOME Sync…')
          s=s.replace('Open full task guidance in Notion ↗','Open full task guidance ↗')
          p.write_text(s,encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npm run build

      - name: Publish stable download in repository
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'HOME Windows installer not found' }
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          Copy-Item $installer.FullName downloads/HOME-Windows-Setup.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/HOME-Windows-Setup.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish HOME Windows installer [skip ci]"
            git push
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOME-Windows-Setup
          path: downloads/HOME-Windows-Setup.exe
          if-no-files-found: error
