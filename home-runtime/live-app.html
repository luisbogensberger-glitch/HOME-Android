<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="vbrain-host" content="17">
<title>V-Brain · Neural Cockpit</title>
<style>
html,body{margin:0;min-height:100%;background:#05070a;color:#fff;font-family:system-ui,sans-serif}
#boot{min-height:100svh;display:grid;place-items:center;text-align:center}
#boot b{font:800 12px ui-monospace,monospace;letter-spacing:.18em}
#boot span{display:block;margin-top:10px;color:#71808f;font-size:11px}
</style>
</head>
<body>
<div id="boot"><div><b>V//BRAIN · LOADING TEST SHELL</b><span>preserving local state</span></div></div>
<script>
(async()=>{
 const token=document.querySelector('meta[name="vbrain-boot"]')?.content||'';
 let h=await fetch('https://raw.githubusercontent.com/luisbogensberger-glitch/HOME-Android/main/home-runtime/live-app-baseline-v17.html?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('baseline '+r.status);return r.text()});
 const boot='<meta name="vbrain-boot" content="'+String(token).replace(/"/g,'&quot;')+'">';
 const css=`<style id="neuralCockpitCSS">
 #homeScreen{background:#05070a!important;color:#f7fbff!important;min-height:100svh!important}
 #homeScreen>.homeHero,#homeScreen>.homeInner{display:none!important}
 #neuralCockpit{min-height:100svh;padding:max(22px,env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));background:radial-gradient(circle at 85% 5%,rgba(91,220,255,.14),transparent 28%),radial-gradient(circle at 8% 78%,rgba(194,255,100,.08),transparent 30%),#05070a;position:relative;overflow:hidden}
 #neuralCockpit:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.3;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px}
 .ncTop,.ncHero,.ncGrid,.ncSignal,.ncFoot{position:relative;z-index:2}
 .ncTop{display:flex;justify-content:space-between;align-items:center}.ncBrand{font:800 11px ui-monospace,monospace;letter-spacing:.16em}.ncDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c8ff72;box-shadow:0 0 16px #c8ff72;margin-right:9px}.ncClock,.ncStatus{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.025);color:#fff;border-radius:10px;height:36px;padding:0 11px;font:700 10px ui-monospace,monospace}.ncStatus{width:36px;padding:0;font-size:17px;margin-left:6px}
 .ncHero{display:grid;grid-template-columns:1fr 106px;gap:14px;align-items:end;padding:48px 2px 34px}.ncHero small{font:800 9px ui-monospace,monospace;letter-spacing:.2em;color:#81e6ff}.ncHero h1{margin:10px 0 0;font-size:50px;line-height:.86;letter-spacing:-.055em;font-weight:560}.ncHero p{margin:16px 0 0;color:rgba(255,255,255,.5);font-size:12px;line-height:1.5;max-width:330px}
 .ncOrb{width:96px;height:96px;border-radius:50%;border:1px solid rgba(129,230,255,.38);display:grid;place-items:center;position:relative;animation:ncspin 8s linear infinite}.ncOrb:after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(200,255,114,.35);border-right-color:transparent}.ncCore{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#efffff,#79d8ef 40%,#18343c 74%);color:#041014;font:900 10px ui-monospace,monospace}
 .ncLabel{grid-column:1/-1;font:800 9px ui-monospace,monospace;letter-spacing:.16em;color:rgba(255,255,255,.35);padding:0 2px 2px}.ncGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ncNode{min-height:148px;border:1px solid rgba(255,255,255,.13);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.018));color:#fff;text-align:left;padding:15px;position:relative}.ncNode:active{transform:scale(.975);border-color:rgba(129,230,255,.4)}.ncNo{font:800 9px ui-monospace,monospace;letter-spacing:.12em;color:#81e6ff}.ncNode:nth-of-type(3) .ncNo{color:#c8ff72}.ncNode:nth-of-type(4) .ncNo{color:#d7b8ff}.ncNode:nth-of-type(5) .ncNo{color:#ffbd89}.ncNode h2{margin:34px 0 7px;font-size:22px;line-height:1}.ncNode p{margin:0;font-size:11px;line-height:1.4;color:rgba(255,255,255,.48);max-width:88%}.ncArrow{position:absolute;right:13px;top:11px;font-size:21px;color:rgba(255,255,255,.45)}
 .ncSignal{width:100%;margin-top:10px;border:1px solid rgba(255,255,255,.13);border-radius:16px;background:rgba(255,255,255,.025);color:#fff;padding:14px;text-align:left;display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:center}.ncPulse{width:28px;height:28px;border-radius:50%;border:1px solid rgba(200,255,114,.45);box-shadow:inset 0 0 0 9px #08100a}.ncPulse:after{content:"";display:block;width:8px;height:8px;margin:9px;border-radius:50%;background:#c8ff72;box-shadow:0 0 12px #c8ff72}.ncSignal b{font-size:11px}.ncSignal span{font-size:10px;color:rgba(255,255,255,.42)}.ncSignal em{font:800 8px ui-monospace,monospace;color:rgba(255,255,255,.35);font-style:normal}.ncFoot{display:flex;justify-content:space-between;margin:16px 2px 0;font:700 8px ui-monospace,monospace;letter-spacing:.08em;color:rgba(255,255,255,.25)}
 @keyframes ncspin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.ncOrb{animation:none!important}}
 </style>`;
 const js=`<script id="neuralCockpitJS">(function(){
 const route=n=>{try{if(n==='gym'&&window.openHomeGym)return openHomeGym();if(window.showScreen)return showScreen(n)}catch(e){}};
 function build(){const home=document.getElementById('homeScreen');if(!home||document.getElementById('neuralCockpit'))return;const x=document.createElement('div');x.id='neuralCockpit';x.innerHTML='<div class="ncTop"><div class="ncBrand"><span class="ncDot"></span>V//BRAIN · TEST</div><div><button class="ncClock" id="ncClock">--:--</button><button class="ncStatus" id="ncStatus">⌁</button></div></div><div class="ncHero"><div><small>ADAPTIVE OPERATING SURFACE</small><h1>Neural<br>Cockpit</h1><p>Same V-Brain state. Completely different live shell.</p></div><div class="ncOrb"><div class="ncCore">VB17</div></div></div><div class="ncGrid"><div class="ncLabel">LIVE MODULES</div><button class="ncNode" data-r="calendar"><span class="ncNo">01 / TIME</span><span class="ncArrow">↗</span><h2>Calendar</h2><p>Your day, mapped as a signal.</p></button><button class="ncNode" data-r="todos"><span class="ncNo">02 / ACTION</span><span class="ncArrow">↗</span><h2>Focus</h2><p>Only the next useful moves.</p></button><button class="ncNode" data-r="tube"><span class="ncNo">03 / LEARN</span><span class="ncArrow">↗</span><h2>Tube</h2><p>Knowledge stream + recall.</p></button><button class="ncNode" data-r="gym"><span class="ncNo">04 / BODY</span><span class="ncArrow">↗</span><h2>Gym</h2><p>Training plan and sessions.</p></button></div><button class="ncSignal" id="ncSignal"><span class="ncPulse"></span><span><b>Runtime linked</b><br><span>Native host + private state active</span></span><em>STATUS</em></button><div class="ncFoot"><span>EXPERIMENT 01</span><span>REVERSIBLE LIVE LAYER</span></div>';home.prepend(x);x.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>route(b.dataset.r));const st=()=>document.getElementById('vbrainLiveStatus17')?.click();x.querySelector('#ncStatus').onclick=st;x.querySelector('#ncSignal').onclick=st;const tick=()=>x.querySelector('#ncClock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,30000)}
 setTimeout(build,200);setTimeout(build,900);})();<\/script>`;
 h=h.replace('</head>',boot+css+'</head>').replace('</body>',js+'</body>');
 document.open();document.write(h);document.close();
})().catch(e=>document.getElementById('boot').innerHTML='<div><b>TEST SHELL ERROR</b><span>'+String(e.message||e)+'</span></div>');
</script>
</body>
</html>
