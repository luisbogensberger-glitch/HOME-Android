<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="vbrain-host" content="17">
<title>V-Brain · Test Shell</title>
<style>
html,body{margin:0;background:#05070a;color:#fff;font-family:system-ui,sans-serif;min-height:100%}
#boot{min-height:100svh;display:grid;place-items:center;text-align:center}
#boot b{font:800 12px ui-monospace,monospace;letter-spacing:.18em}#boot span{display:block;margin-top:10px;color:#71808f;font-size:11px}
</style>
</head>
<body>
<div id="boot"><div><b>V//BRAIN · SWITCHING SHELL</b><span>preserving local state</span></div></div>
<script>
(async function(){
  const token=(document.querySelector('meta[name="vbrain-boot"]')||{content:""}).content||"";
  let html=await fetch("https://raw.githubusercontent.com/luisbogensberger-glitch/HOME-Android/main/home-runtime/live-app-baseline-v17.html?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("baseline "+r.status);return r.text()});
  const bootMeta='<meta name="vbrain-boot" content="'+String(token).replace(/"/g,'&quot;')+'">';
  html=html.replace('</head>',bootMeta+"\n<style id=\"vbrainTestCockpitStyle\">\n:root{\n  --vbtest-bg:#05070a;\n  --vbtest-panel:#0b1016;\n  --vbtest-line:rgba(255,255,255,.13);\n  --vbtest-soft:rgba(255,255,255,.56);\n  --vbtest-bright:#f6f9ff;\n  --vbtest-cyan:#81e6ff;\n  --vbtest-lime:#c8ff72;\n}\n#homeScreen{background:var(--vbtest-bg)!important;color:var(--vbtest-bright)!important;min-height:100svh!important;overflow-x:hidden!important}\n#homeScreen>.homeHero,#homeScreen>.homeInner{display:none!important}\n#vbTestCockpit{\n  position:relative;min-height:100svh;padding:max(22px,env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));\n  overflow:hidden;background:\n    radial-gradient(circle at 84% 8%,rgba(129,230,255,.11),transparent 28%),\n    radial-gradient(circle at 8% 75%,rgba(200,255,114,.07),transparent 30%),\n    #05070a;\n}\n#vbTestCockpit:before{\n  content:\"\";position:absolute;inset:0;pointer-events:none;opacity:.35;\n  background-image:\n    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),\n    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);\n  background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 92%);\n}\n.vbtTop{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px}\n.vbtBrand{display:flex;align-items:center;gap:10px;font:800 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase}\n.vbtLiveDot{width:8px;height:8px;border-radius:50%;background:var(--vbtest-lime);box-shadow:0 0 18px rgba(200,255,114,.68)}\n.vbtMeta{display:flex;align-items:center;gap:8px}\n.vbtClock,.vbtControl{height:36px;border:1px solid var(--vbtest-line);background:rgba(255,255,255,.025);color:rgba(255,255,255,.72);border-radius:10px;padding:0 11px;font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.07em}\n.vbtControl{width:36px;padding:0;font-size:17px;color:#fff}\n.vbtHero{position:relative;z-index:2;display:grid;grid-template-columns:1fr 124px;align-items:end;gap:15px;padding:46px 2px 32px}\n.vbtEyebrow{font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;color:var(--vbtest-cyan);text-transform:uppercase;margin-bottom:12px}\n.vbtHero h1{margin:0;font-size:clamp(48px,14vw,82px);font-weight:520;line-height:.84;letter-spacing:-.065em}\n.vbtHero p{margin:17px 0 0;max-width:390px;color:rgba(255,255,255,.52);font-size:13px;line-height:1.55}\n.vbtOrb{width:118px;height:118px;position:relative;display:grid;place-items:center;justify-self:end}\n.vbtOrb:before,.vbtOrb:after{content:\"\";position:absolute;border-radius:50%;border:1px solid rgba(129,230,255,.32);animation:vbtSpin 9s linear infinite}\n.vbtOrb:before{inset:0;border-left-color:transparent;border-bottom-color:rgba(200,255,114,.45)}\n.vbtOrb:after{inset:16px;border-right-color:transparent;animation-duration:6s;animation-direction:reverse}\n.vbtCore{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#eaffff,#7bd8ef 35%,#16313a 72%);box-shadow:0 0 35px rgba(129,230,255,.34);color:#041014;font:900 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace}\n.vbtSectionLabel{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;color:rgba(255,255,255,.42);font:800 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.17em;text-transform:uppercase}\n.vbtGrid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.vbtNode{\n  min-height:154px;border:1px solid var(--vbtest-line);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));\n  color:#fff;text-align:left;padding:15px;position:relative;overflow:hidden;box-shadow:none;transition:transform .14s ease,border-color .14s ease,background .14s ease;\n}\n.vbtNode:before{content:\"\";position:absolute;right:-26px;bottom:-34px;width:88px;height:88px;border:1px solid rgba(255,255,255,.08);border-radius:50%}\n.vbtNode:active{transform:scale(.975);border-color:rgba(129,230,255,.38);background:rgba(129,230,255,.055)}\n.vbtNodeNo{font:800 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(255,255,255,.35);letter-spacing:.12em}\n.vbtNode h2{margin:34px 0 7px;font-size:23px;line-height:1;font-weight:590;letter-spacing:-.035em}\n.vbtNode p{margin:0;max-width:85%;font-size:11.5px;line-height:1.38;color:rgba(255,255,255,.48)}\n.vbtArrow{position:absolute;top:12px;right:13px;font-size:22px;font-weight:240;color:rgba(255,255,255,.48)}\n.vbtNode[data-route=\"calendar\"] .vbtNodeNo{color:var(--vbtest-cyan)}\n.vbtNode[data-route=\"todos\"] .vbtNodeNo{color:var(--vbtest-lime)}\n.vbtNode[data-route=\"tube\"] .vbtNodeNo{color:#d5b8ff}\n.vbtNode[data-route=\"gym\"] .vbtNodeNo{color:#ffbd89}\n.vbtSignal{position:relative;z-index:2;margin-top:10px;border:1px solid var(--vbtest-line);border-radius:16px;padding:14px 15px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:rgba(255,255,255,.025)}\n.vbtPulse{width:28px;height:28px;border-radius:50%;border:1px solid rgba(200,255,114,.45);position:relative}\n.vbtPulse:after{content:\"\";position:absolute;inset:8px;border-radius:50%;background:var(--vbtest-lime);box-shadow:0 0 16px rgba(200,255,114,.5)}\n.vbtSignal b{display:block;font-size:11px;letter-spacing:.02em}.vbtSignal span{display:block;margin-top:3px;font-size:10px;color:rgba(255,255,255,.42)}\n.vbtSignal em{font:800 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(255,255,255,.38);font-style:normal;letter-spacing:.08em}\n.vbtFoot{position:relative;z-index:2;margin:16px 2px 0;display:flex;justify-content:space-between;color:rgba(255,255,255,.25);font:700 8.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}\n@keyframes vbtSpin{to{transform:rotate(360deg)}}\n@media(max-width:390px){\n  .vbtHero{grid-template-columns:1fr 96px;padding-top:38px}.vbtOrb{width:92px;height:92px}.vbtOrb:after{inset:13px}.vbtCore{width:40px;height:40px}\n  .vbtHero h1{font-size:46px}.vbtNode{min-height:145px}.vbtNode h2{font-size:21px}\n}\n@media(prefers-reduced-motion:reduce){.vbtOrb:before,.vbtOrb:after{animation:none!important}}\n</style>\n"+'</head>');
  html=html.replace('</body>',"\n<script id=\"vbrainTestCockpitJS\">\n(function(){\n  'use strict';\n  function route(name){\n    try{\n      if(name==='gym' && typeof window.openHomeGym==='function') return window.openHomeGym();\n      if(typeof window.showScreen==='function') return window.showScreen(name);\n    }catch(_){}\n  }\n  function metricText(id,fallback){\n    const el=document.getElementById(id);\n    return (el&&String(el.textContent||'').trim())||fallback;\n  }\n  function build(){\n    const home=document.getElementById('homeScreen');\n    if(!home||document.getElementById('vbTestCockpit')) return;\n    const shell=document.createElement('div');\n    shell.id='vbTestCockpit';\n    shell.innerHTML=`\n      <div class=\"vbtTop\">\n        <div class=\"vbtBrand\"><span class=\"vbtLiveDot\"></span><span>V//BRAIN \u00b7 TEST SHELL</span></div>\n        <div class=\"vbtMeta\"><span class=\"vbtClock\" id=\"vbtClock\">--:--</span><button class=\"vbtControl\" id=\"vbtControl\" aria-label=\"V-Brain status\">\u2301</button></div>\n      </div>\n      <div class=\"vbtHero\">\n        <div>\n          <div class=\"vbtEyebrow\">adaptive operating surface</div>\n          <h1>Neural<br>Cockpit</h1>\n          <p>Same V-Brain state. Completely different shell. This interface is injected live and can be removed again without touching your data.</p>\n        </div>\n        <div class=\"vbtOrb\" aria-hidden=\"true\"><div class=\"vbtCore\">VB17</div></div>\n      </div>\n      <div class=\"vbtSectionLabel\"><span>modules</span><span>live routing</span></div>\n      <div class=\"vbtGrid\">\n        <button class=\"vbtNode\" data-route=\"calendar\"><span class=\"vbtNodeNo\">01 / TIME</span><span class=\"vbtArrow\">\u2197</span><h2>Calendar</h2><p id=\"vbtCalendar\">Your day, mapped as a signal.</p></button>\n        <button class=\"vbtNode\" data-route=\"todos\"><span class=\"vbtNodeNo\">02 / ACTION</span><span class=\"vbtArrow\">\u2197</span><h2>Focus</h2><p id=\"vbtTodos\">Only the next useful moves.</p></button>\n        <button class=\"vbtNode\" data-route=\"tube\"><span class=\"vbtNodeNo\">03 / LEARN</span><span class=\"vbtArrow\">\u2197</span><h2>Tube</h2><p id=\"vbtTube\">Knowledge stream + recall.</p></button>\n        <button class=\"vbtNode\" data-route=\"gym\"><span class=\"vbtNodeNo\">04 / BODY</span><span class=\"vbtArrow\">\u2197</span><h2>Gym</h2><p>Training plan and recent sessions.</p></button>\n      </div>\n      <button class=\"vbtSignal\" id=\"vbtSignal\">\n        <span class=\"vbtPulse\"></span><span><b>Runtime linked</b><span>Native host + private state remain active</span></span><em>OPEN STATUS</em>\n      </button>\n      <div class=\"vbtFoot\"><span>interface experiment 01</span><span>reversible live layer</span></div>`;\n    home.insertBefore(shell,home.firstChild);\n    shell.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>route(b.dataset.route)));\n    const openStatus=()=>document.getElementById('vbrainLiveStatus17')?.click();\n    shell.querySelector('#vbtControl').onclick=openStatus;\n    shell.querySelector('#vbtSignal').onclick=openStatus;\n    function tick(){\n      const c=shell.querySelector('#vbtClock'); if(c)c.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});\n      const cal=shell.querySelector('#vbtCalendar'); if(cal)cal.textContent=metricText('homeCalendarText','Your day, mapped as a signal.');\n      const td=shell.querySelector('#vbtTodos'); if(td)td.textContent=metricText('homeTodoText','Only the next useful moves.');\n      const tu=shell.querySelector('#vbtTube'); if(tu)tu.textContent=metricText('homeTubeText','Knowledge stream + recall.');\n    }\n    tick();setInterval(tick,30000);\n  }\n  setTimeout(build,180);\n  setTimeout(build,900);\n  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(build,50)});\n})();\n</script>\n"+'</body>');
  document.open();document.write(html);document.close();
})().catch(function(err){
  document.getElementById('boot').innerHTML='<div><b>TEST SHELL COULD NOT LOAD</b><span>'+String(err.message||err)+'</span></div>';
});
</script>
</body>
</html>
